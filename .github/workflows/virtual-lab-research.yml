name: VirtualLab research boundary
on:
  push:
    branches: ['codex/shared-research-reader-review']
  pull_request:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install detect-secrets==1.5.0
      - run: python scripts/verify-web-secrets.py
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:research
      - run: npm run test:conversion
      - run: npm run test:agents
      - run: npm run test:intent-router
      - run: node --test scripts/verify-product-onboarding.cjs scripts/verify-research-agents.cjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
