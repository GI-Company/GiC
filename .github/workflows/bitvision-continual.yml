name: BitVision persistent sparse learner - real ONNX
on:
  push:
    branches: ['research/bitvision-sparse-real-onnx-20261031']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore persistent learning memory
        uses: actions/cache@v4
        with:
          path: research/bitvision-cell/sparse-agent/.state/memory.json
          key: bitvision-continuum-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bitvision-continuum-${{ github.ref_name }}-
      - name: Install CPU inference dependencies
        run: python -m pip install numpy==2.2.6 onnxruntime==1.22.1
      - name: Train across episodes, validate and gate model promotion
        run: |
          python research/bitvision-cell/sparse-agent/continual.py             --memory research/bitvision-cell/sparse-agent/.state/memory.json             --report bitvision_continual_report.json             --train-episodes 20 --eval-seeds 10 --epoch ${{ github.run_number }}
      - name: Publish all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvision-continual-evidence
          path: |
            bitvision_continual_report.json
            research/bitvision-cell/sparse-agent/.state/memory.json
          if-no-files-found: warn
